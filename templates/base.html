{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Patient Management{% endblock %}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="navbar__brand">Clinic Admin</div>
        <nav class="navbar__actions">
            <a href="{% url 'doctors:home' %}" class="btn">Home</a>
                <a href="{% url 'patients:list' %}" class="btn">Patients</a>
                <a href="{% url 'appointments:list' %}" class="btn">Appointment</a>
                <button id="themeToggle" class="btn btn--ghost" type="button">🌓</button>;
        </nav>
    </header>
    <main class="container">
        {% include 'partials/messages.html' %}
        {% block content %} {% endblock %}
    </main>

    <script>
        // Persisted light/dark toggle
        const root = document.documentElement;
        const KEY = "clinic_theme";
        const saved = localStorage.getItem(KEY);
        if (saved) {
        root.dataset.theme = saved;
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem(KEY, root.dataset.theme);
        });
    </script>

    <footer class="mt-12 border-t bg-white">
        <div class="mx-auto max-w-6xl px-4 py-6 text-xs text-gray-500">
            &copy; {{now|date:"Y"}} Clinic Appointment Management. All rights reserved.
        </div>
    </footer>
</body>
</html>
